[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hiring-signal-tracker"
version = "0.1.0.dev0"
description = "Local hiring-signal measurement tooling; initial keyless scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
hst = "hiring_signals.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hiring_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
